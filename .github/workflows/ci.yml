name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and deterministic tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Noturcode
        run: |
          set -o pipefail
          xcodebuild \
            -project Noturcode.xcodeproj \
            -scheme Noturcode \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/NoturcodeDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run Core and Integration tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Noturcode.xcodeproj \
            -scheme Noturcode \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/NoturcodeDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:NoturcodeCoreTests \
            -only-testing:NoturcodeIntegrationTests \
            test

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository and history with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
